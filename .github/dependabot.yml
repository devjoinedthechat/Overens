version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Packages that are released together are raised together.
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql*"]
      aspire:
        patterns: ["Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      tests:
        patterns: ["xunit*", "Testcontainers*", "CsCheck", "Microsoft.NET.Test.Sdk", "Microsoft.Playwright"]
    ignore:
      # From 6.5 the library is AGPL and refuses to run without a licence. 6.2 is MIT.
      - dependency-name: PDFsharp-MigraDoc
        versions: [">=6.5.0"]
      # These follow the .NET version the code is built for. A new major arrives with the move to that .NET,
      # not on its own: version 11 beside the .NET 10 web framework runs the logging generator twice.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      # A new Aspire major changes the host's API and moves with the AppHost SDK version in src/AppHost.
      # It is taken by hand, in one change.
      - dependency-name: "Aspire.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
